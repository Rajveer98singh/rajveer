    <script>
        // Dark mode
        const darkToggle = document.getElementById('dark-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        const html = document.documentElement;
        function setDarkMode(isDark) {
            html.classList.toggle('dark', isDark);
            sunIcon.classList.toggle('hidden', !isDark);
            moonIcon.classList.toggle('hidden', isDark);
            localStorage.setItem('darkMode', isDark ? 'dark' : 'light');
        }
        const saved = localStorage.getItem('darkMode');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) setDarkMode(true);
        darkToggle.addEventListener('click', () => setDarkMode(!html.classList.contains('dark')));

        // Mobile nav
        const mobileBtn = document.getElementById('mobile-nav-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        function toggleMobileNav() { sidebar.classList.toggle('open'); overlay.classList.toggle('hidden'); }
        mobileBtn.addEventListener('click', toggleMobileNav);
        overlay.addEventListener('click', toggleMobileNav);

        // Copy CV link
        function copyCV(btn) {
            navigator.clipboard.writeText('https://drive.google.com/file/d/1vO1l-KVkkdzE-AECGHJIb3YufZff9Cm8/view?usp=sharing');
            const origHTML = btn.innerHTML;
            btn.innerHTML = '<svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Copied!';
            setTimeout(() => { btn.innerHTML = origHTML; }, 2000);
        }

        document.getElementById('year').textContent = new Date().getFullYear();
